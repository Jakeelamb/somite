[workspace]
name = "somite"
version = "0.1.0"
description = "Visual, reproducible bioinformatics workflow builder"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
nodejs = ">=22.13,<23"

[tasks]
install = "npm ci"
build = "npm run build"
setup = "npm ci && npm run build"
dev = "npm run dev"
start = "npm start"
smoke = "npm run smoke:release"
check = "npm run check"
