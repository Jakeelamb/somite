[workspace]
name = "somite"
version = "0.1.0"
description = "Visual, reproducible bioinformatics workflow builder"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
nodejs = ">=22.13,<23"

[tasks]
setup = "npm ci"
dev = "npm run dev"
check = "npm run check"
