[workspace]
name = "somite"
version = "0.1.0"
description = "Visual, reproducible bioinformatics workflow builder"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
nodejs = ">=22.13,<23"
nextflow = "==26.04.6"
openjdk = "==25.0.2"

[tasks]
install = "npm ci"
build = "npm run build"
benchmark-quick = "npm run benchmark:quick --"
benchmark-release = "npm run benchmark:release --"
benchmark-compare = "npm run benchmark:compare --"
setup = "npm ci && npm run build"
dev = "npm run dev"
start = "npm start"
smoke = "npm run smoke:release"
smoke-execution = "npm run smoke:execution"
check = "npm run check"
proof-source = "npm run proof:source"
profile-cpu = "npm run profile:cpu --"
profile-heap = "npm run profile:heap --"
