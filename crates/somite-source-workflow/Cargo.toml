[package]
name = "somite-source-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Pinned source-backed Nextflow workflow inspection, edits, and freezing"

[dependencies]
somite-ir = { path = "../somite-ir" }
blake3 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
