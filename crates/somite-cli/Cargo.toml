[package]
name = "somite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Somite compiler and development oracle"
default-run = "somite"

[[bin]]
name = "somite"
path = "src/main.rs"

[dependencies]
somite-ir = { path = "../somite-ir" }
somite-ops = { path = "../somite-ops" }
somite-bundle = { path = "../somite-bundle" }
somite-cook = { path = "../somite-cook" }
somite-paper = { path = "../somite-paper" }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
