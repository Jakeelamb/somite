[package]
name = "somite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "somite cook / app"
default-run = "somite"

[[bin]]
name = "somite"
path = "src/main.rs"

[dependencies]
somite-ir = { path = "../somite-ir" }
somite-ops = { path = "../somite-ops" }
somite-nextflow = { path = "../somite-nextflow" }
somite-cook = { path = "../somite-cook" }
somite-paper = { path = "../somite-paper" }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
