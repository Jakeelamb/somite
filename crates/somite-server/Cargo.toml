[package]
name = "somite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Local web interface for Somite projects"

[dependencies]
anyhow = "1"
blake3 = "1"
getrandom = "0.4"
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "754d5aa1ce2cfa54ba2c2a6d3edc7e7b6bce28eb" }
somite-assessment = { path = "../somite-assessment" }
somite-ir = { path = "../somite-ir" }
somite-bundle = { path = "../somite-bundle" }
somite-fixtures = { path = "../somite-fixtures" }
somite-linker = { path = "../somite-linker" }
somite-ops = { path = "../somite-ops" }
somite-paper = { path = "../somite-paper" }
axum = { version = "0.8", features = ["multipart"] }
rmcp = { version = "3.1.4", features = ["client", "server", "transport-child-process", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "=8.6.0", default-features = false }
