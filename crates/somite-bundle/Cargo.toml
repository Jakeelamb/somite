[package]
name = "somite-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable Somite workflow and toolchain bundles"

[dependencies]
somite-ir = { path = "../somite-ir" }
somite-ops = { path = "../somite-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3"
