[package]
name = "axial-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable Axial workflow and toolchain bundles"

[dependencies]
axial-ir = { path = "../axial-ir" }
axial-ops = { path = "../axial-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3"
