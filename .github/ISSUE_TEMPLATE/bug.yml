name: Bug report
description: Report a reproducible problem in Somite.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Somite. Remove private data, credentials, and unpublished paper content from examples and logs.
  - type: input
    id: version
    attributes:
      label: Somite version
      description: Release tag or Git commit.
      placeholder: vX.Y.Z or e5549d2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Node.js, and Pixi versions.
      placeholder: Ubuntu 24.04, x86_64, Node 22.13.0, Pixi 0.77.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Visual app
        - Workflow compilation or execution
        - Validation or evidence
        - Paper reconstruction
        - Agent or MCP integration
        - Local runner
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe graph or fixture that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact errors and sanitized logs when available.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, and unpublished source material.
          required: true
