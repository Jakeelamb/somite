name: Official MCP upstream canary

on:
  schedule:
    - cron: "19 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-mcp-upstream-canary
  cancel-in-progress: false

jobs:
  upstream:
    name: Pixi and Nextflow documentation and discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked Pixi environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.77.1
          locked: true
          cache: true
          cache-write: false
          activate-environment: true
      - name: Install locked dependencies
        run: npm ci
      - name: Verify live official MCP dependencies
        env:
          SOMITE_MCP_CANARY_GITHUB_TOKEN: ${{ github.token }}
        run: npm run canary:mcp:live
