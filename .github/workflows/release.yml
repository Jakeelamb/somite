name: Publish source release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked Pixi environment
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          locked: true
          cache: true
          cache-write: false
          activate-environment: true
      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          web_version="$(node -p "require('./web/package.json').version")"
          runner_version="$(node -p "require('./runner/package.json').version")"
          workflow_version="$(node -p "require('./packages/workflow/package.json').version")"
          pixi_version="$(node -e "const fs=require('fs'); const text=fs.readFileSync('pixi.toml','utf8'); const match=text.match(/^version = \"([^\"]+)\"/m); if (!match) process.exit(1); process.stdout.write(match[1])")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_package_version="$(node -p "require('./package-lock.json').packages[''].version")"
          lock_web_version="$(node -p "require('./package-lock.json').packages.web.version")"
          lock_runner_version="$(node -p "require('./package-lock.json').packages.runner.version")"
          lock_workflow_version="$(node -p "require('./package-lock.json').packages['packages/workflow'].version")"
          test "$tag_version" = "$root_version"
          test "$tag_version" = "$web_version"
          test "$tag_version" = "$runner_version"
          test "$tag_version" = "$workflow_version"
          test "$tag_version" = "$pixi_version"
          test "$tag_version" = "$lock_version"
          test "$tag_version" = "$lock_package_version"
          test "$tag_version" = "$lock_web_version"
          test "$tag_version" = "$lock_runner_version"
          test "$tag_version" = "$lock_workflow_version"
      - name: Install locked TypeScript dependencies
        run: npm ci
      - name: Typecheck product
        run: npm run typecheck
      - name: Lint product
        run: npm run lint
      - name: Build and test product
        run: npm test
      - name: Exercise production startup and real workflow execution
        run: pixi run smoke
      # GitHub's generated source archives are the only release artifacts.
      - name: Create source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Somite $GITHUB_REF_NAME"
