name: Publish source release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag_object: ${{ steps.release_identity.outputs.tag_object }}
      commit: ${{ steps.release_identity.outputs.commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify annotated tag is on main
        id: release_identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag || {
            echo "Release tags must be annotated."
            exit 1
          }
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main || {
            echo "Release commit must be reachable from origin/main."
            exit 1
          }
          tag_object="$(git rev-parse "$RELEASE_TAG^{tag}")"
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git cat-file -t "$commit")" = commit
          test "$(git rev-parse "$RELEASE_COMMIT^{commit}")" = "$commit"
          printf 'tag_object=%s\ncommit=%s\n' "$tag_object" "$commit" >> "$GITHUB_OUTPUT"
      - name: Set up locked Pixi environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.77.1
          locked: true
          cache: true
          cache-write: false
          activate-environment: true
      - name: Verify tag and package versions
        run: npm run check:version -- "$GITHUB_REF_NAME"
      - name: Install locked TypeScript dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck product
        run: npm run typecheck
      - name: Lint product
        run: npm run lint
      - name: Build and test product
        run: npm test
      - name: Prove committed source installs, builds, and starts
        run: npm run proof:source
      - name: Upload clean-source proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-proof-${{ github.sha }}
          path: output/benchmarks/source-proof-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Exercise production browser journeys
        run: npm run smoke:browser
      - name: Exercise production startup and real workflow execution
        run: pixi run smoke

  publish:
    name: Publish verified source
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      # GitHub's generated source archives are the only release artifacts. This
      # job intentionally has no checkout or third-party executable step.
      - name: Publish the exact verified tag object
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          remote_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + ":" + .object.sha')"
          remote_target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$VERIFIED_TAG_OBJECT" --jq '.object.type + ":" + .object.sha')"
          test "$remote_ref" = "tag:$VERIFIED_TAG_OBJECT" || {
            echo "Release tag moved after verification."
            exit 1
          }
          test "$remote_target" = "commit:$VERIFIED_COMMIT" || {
            echo "Verified tag no longer resolves to the tested commit."
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Somite $GITHUB_REF_NAME"
